[zsh]
.zshrc = ~/.zshrc
.zprofile = ~/.zprofile

[ghostty]
config = ~/.config/ghostty/config

[starship]
starship.toml = ~/.config/starship.toml

[karabiner]
karabiner.json = ~/.config/karabiner/karabiner.json;mode=copy

[sublime]
Preferences.sublime-settings = ~/Library/Application Support/Sublime Text/Packages/User/Preferences.sublime-settings
Package Control.sublime-settings = ~/Library/Application Support/Sublime Text/Packages/User/Package Control.sublime-settings
Default (OSX).sublime-keymap = ~/Library/Application Support/Sublime Text/Packages/User/Default (OSX).sublime-keymap

[tmux]
.tmux.conf = ~/.tmux.conf

[bettercmdtab]
config.json = ~/.config/bettercmdtab/config.json

[sheldon]
plugins.toml = ~/.config/sheldon/plugins.toml
